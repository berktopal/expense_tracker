name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: expense_tracker
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pci-only-password" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      PORT: 5000
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASS: ci-only-password
      DB_NAME: expense_tracker
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Smoke test (register, login, create, list)
        run: |
          node server.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -s localhost:5000/api/me >/dev/null && break; sleep 1; done
          curl -sf -X POST localhost:5000/api/register -H 'Content-Type: application/json' -d '{"username":"ci","password":"ci-password-1"}'
          TOKEN=$(curl -sf -X POST localhost:5000/api/login -H 'Content-Type: application/json' -d '{"username":"ci","password":"ci-password-1"}' | node -pe 'JSON.parse(require("fs").readFileSync(0)).token')
          curl -sf -X POST localhost:5000/api/transactions -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"title":"Test","amount":10,"date":"2026-01-01"}'
          test "$(curl -sf localhost:5000/api/transactions -H "Authorization: Bearer $TOKEN" | node -pe 'JSON.parse(require("fs").readFileSync(0)).length')" = "1"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:5000/api/transactions)" = "401"
          echo "smoke test passed"
      - if: failure()
        run: cat server.log

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build
        env:
          CI: "false"
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log || { echo "::error title=build::$(grep -v '^\s*$' build.log | tail -40 | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
