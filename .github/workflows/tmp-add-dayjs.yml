name: tmp add dayjs
on:
  push:
    branches: [add-ci]
    paths: [.github/workflows/tmp-add-dayjs.yml]
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci
      - run: npm install dayjs@^1.11.13 --save
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q ../.github/workflows/tmp-add-dayjs.yml
          git add package.json package-lock.json
          git commit -m "Add missing dayjs dependency to frontend"
          git push
